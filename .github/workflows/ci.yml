name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://sochle:sochle@localhost:5432/sochle_test
      TEST_DATABASE_URL: postgresql://sochle:sochle@localhost:5432/sochle_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sochle_test
          POSTGRES_PASSWORD: sochle
          POSTGRES_USER: sochle
        options: >-
          --health-cmd "pg_isready -U sochle -d sochle_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @sochle/db db:migrate
      - run: pnpm test
      - run: pnpm build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
